<!-- type: service
     hero photo · nav nav-centre · close close-photo · footer footer-columns · buttons solid · mark ring
     palette oxblood-grey (stone ground, oxblood ink; the firm's statement on an oxblood band) · type Newsreader / Hanken Grotesk · radius soft
     layout: sections as tall as their content (src/page.css), not the kit's one section per screen
     motion: the hero's entrance, word-highlight in #about, scroll reveals, photographs that drift, the hover layer -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Hanken+Grotesk:wght@400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/system.css">
<link rel="stylesheet" href="/assets/ui/cards.css">
<link rel="stylesheet" href="/assets/motion/motion.css">
<link rel="stylesheet" href="/assets/backgrounds/backgrounds.css">
<link rel="stylesheet" href="/assets/layout/layout.css">
<link rel="stylesheet" href="/assets/icons/icon.css">
<!-- keep this <style> after the links: layout.css resets --ly-scale -->
<style>
:root {
  --p-bg: #e2e2e2; --p-surface: #d6d6d6; --p-ink: #7d0c14; --p-muted: #7a4a4e;
  --p-accent: #7d0c14; --p-accent-ink: #e2e2e2; --p-action: #7d0c14; --p-action-ink: #e2e2e2;
  --p-inv-bg: #7d0c14; --p-inv-surface: #862323; --p-inv-ink: #e2e2e2; --p-inv-muted: #d0b3af;
  --p-inv-accent: #e2e2e2; --p-inv-accent-ink: #7d0c14; --p-inv-action: #e2e2e2; --p-inv-action-ink: #7d0c14;
  --font-display: "Newsreader", Georgia, serif;
  --font-text: "Hanken Grotesk", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.018em;
  --display-tracking-xl: -0.025em;
  --ly-scale: 1.06;
}
</style>
<!-- the page's own CSS is src/page.css (imported by main.tsx, so Vite links it last): the layout
     that replaces the kit's one section per screen, the scroll reveals, the photographs' drift and the hover layer. -->
<!-- the reveals: parts wait hidden only while this class is set; if motion.ts never starts, everything shows after four seconds -->
<script>document.documentElement.classList.add('rv-js');window.__rv=setTimeout(()=>document.documentElement.classList.add('rv-safe'),4000)</script>
<!-- the hero's entrance: the words wait for motion.js instead of flashing; the 700ms mark fades them in if it is late -->
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
<script src="/assets/backgrounds/backgrounds.js"></script>
<!-- the dealt moment: the guard, then preloads for the core and word-highlight; system.js mounts it -->
<script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
<link rel="modulepreload" href="/assets/moments/moments.js">
<link rel="modulepreload" href="/assets/moments/lib.js">
<link rel="modulepreload" href="/assets/moments/word-highlight/moment.js">
<script type="module" src="/src/main.tsx"></script>
</head>
